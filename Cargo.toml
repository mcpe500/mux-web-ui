[package]
name = "mux-web"
version = "0.1.0"
edition = "2021"
authors = ["Mux Web UI Team"]
description = "Lightweight local web desktop & control center for Termux and Linux"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time", "process", "signal", "fs"] }
axum = { version = "0.7", features = ["ws", "json", "query"] }
tower-http = { version = "0.5", features = ["cors", "set-header"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
rust-embed = { version = "8.4", features = ["compression"] }
portable-pty = "0.8"
mime_guess = "2.0"
bytes = "1.6"
futures-util = "0.3"
tempfile = "3.10"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"
tempfile = "3.10"
