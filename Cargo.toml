[package]
name = "mux-web"
version = "0.6.4"
edition = "2021"
authors = ["Mux Web UI Team"]
description = "Lightweight local web desktop & control center for Termux and Linux"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time", "process", "signal", "fs"] }
axum = { version = "0.7", features = ["ws", "json", "query"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower-http = { version = "0.5", features = ["cors", "set-header"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
rust-embed = { version = "8.4", features = ["compression"] }
nix = { version = "0.29", features = ["term", "ioctl", "process", "signal", "fs", "net"] }
libc = "0.2"
mime_guess = "2.0"
bytes = "1.6"
futures-util = "0.3"
tempfile = "3.10"
getrandom = "0.2"
subtle = "2.6"
zip = "0.6"
tar = "0.4"
flate2 = "1.0"
walkdir = "2.4"
rcgen = "0.13"
rustls-pemfile = "2.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
tokio-tungstenite = "0.23"
http = "1.1"
futures-util = "0.3"
tempfile = "3.10"
