name: CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-lint:
    name: Build & Test (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      - name: Run Tests
        run: cargo test

  cross-check:
    name: Cross-Compile Check (Android ARM64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust & target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # zstd-sys (C dep via cc-rs) needs an Android-capable clang; point cc
      # and rustc straight at the runner-preinstalled NDK toolchain wrappers.
      # (cargo-ndk dropped: it panics at startup with current stable cargo.)
      - name: Check Android ARM64 Build (preinstalled NDK)
        run: |
          NDK="${ANDROID_NDK_ROOT:-$(ls -d /usr/local/lib/android/sdk/ndk/* | head -1)}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "Using NDK: $NDK"
          export PATH="$TOOLCHAIN:$PATH"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android24-clang"
          cargo check --target aarch64-linux-android

  budget-check:
    name: Budget & Metric Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release

      - name: Verify Budget & Metrics
        run: bash ./scripts/check_budget.sh

  # Milestone A — multi-target release pipeline (DIST-001..006)
  release:
    name: Release (${{ matrix.target }})
    needs: [test-and-lint, cross-check, budget-check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl
            apt: musl-tools
          - target: aarch64-unknown-linux-gnu
            apt: gcc-aarch64-linux-gnu
            # Newer rustc defaults to bundled rust-lld for this target, but the
            # gcc-ld shim resolves against the HOST bin dir -> x86_64 lld ->
            # "--fix-cortex-a53-843419 is only supported on AArch64". Drive the
            # real cross gcc + GNU ld instead.
            linker: aarch64-linux-gnu-gcc
            # Stable only allows y/n for this target; 'no' disables the bundled
            # rust-lld default so the cross gcc drives GNU ld, which natively
            # supports --fix-cortex-a53-843419 emitted by ring/aws-lc-sys.
            rustflags: "-Clink-self-contained=no"
          - target: aarch64-linux-android
            android: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross-compile dependencies
        if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      # cargo-ndk dropped (panics at startup with current stable cargo); wire
      # cc + rustc directly to the runner-preinstalled NDK wrappers instead.
      - name: Build Release (Android ARM64, API 24, preinstalled NDK)
        if: matrix.android
        run: |
          NDK="${ANDROID_NDK_ROOT:-$(ls -d /usr/local/lib/android/sdk/ndk/* | head -1)}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "Using NDK: $NDK"
          export PATH="$TOOLCHAIN:$PATH"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android24-clang"
          cargo build --release --target aarch64-linux-android

      - name: Build Release
        if: ${{ !matrix.android }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package, Checksum & Verify (DIST-005)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BIN="mux-web-$VERSION-${{ matrix.target }}"
          mkdir -p dist
          if [ "${{ matrix.android }}" = "true" ]; then
            cp target/aarch64-linux-android/release/mux-web "dist/$BIN"
          else
            cp "target/${{ matrix.target }}/release/mux-web" "dist/$BIN"
          fi
          (cd dist && sha256sum "$BIN" > "$BIN.sha256")
          ls -lh "dist/$BIN"
          file "dist/$BIN" | sed 's/^dist\/[^:]*: //'
          readelf -h "dist/$BIN" 2>/dev/null | grep -E "Class:|Machine:" || true

      - name: Smoke Test (native x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: ./dist/mux-web-${GITHUB_REF_NAME#v}-x86_64-unknown-linux-gnu --version

      - name: Upload Artifact (per target)
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release-summary:
    name: Assemble Release (checksums.txt)
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # GITHUB_TOKEN must be allowed to create the GitHub Release and upload assets.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all target artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Aggregate checksums (DIST-005)
        run: |
          (cd dist && sha256sum mux-web-* > checksums.txt)
          cat dist/checksums.txt
          ls -lh dist/

      - name: Upload Release Artifacts (DIST-006)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mux-web-*
            dist/checksums.txt

  # Milestone B — installer/updater testability (DIST-013)
  installer-test:
    name: Installer & Updater Test (DIST-013)
    needs: [test-and-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release

      - name: Prepare staging (two versions)
        run: |
          set -e
          # Derive from Cargo.toml so the fixture never drifts from the app version.
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "STAGED_VERSION=$VERSION" >> "$GITHUB_ENV"
          TARGET="x86_64-unknown-linux-gnu"
          mkdir -p "dist/v$VERSION" "dist/v0.2.0"
          cp target/release/mux-web "dist/v$VERSION/mux-web-$VERSION-$TARGET"
          (cd "dist/v$VERSION" && sha256sum "mux-web-$VERSION-$TARGET" > "mux-web-$VERSION-$TARGET.sha256")
          printf '#!/bin/sh\necho "mux-web 0.2.0"\n' > "dist/v0.2.0/mux-web-0.2.0-$TARGET"
          chmod +x "dist/v0.2.0/mux-web-0.2.0-$TARGET"
          (cd "dist/v0.2.0" && sha256sum "mux-web-0.2.0-$TARGET" > "mux-web-0.2.0-$TARGET.sha256")
          printf '{"tag_name":"v%s"}' "$VERSION" > "dist/latest.json"

      - name: Scenario 1 — clean install, latest via staging (DIST-007)
        run: |
          export MUX_WEB_BASE_URL="file://$PWD/dist"
          export MUX_WEB_API_URL="file://$PWD/dist/latest.json"
          export MUX_WEB_INSTALL_DIR="$PWD/scen1"
          bash install.sh >/dev/null
          ./scen1/mux-web --version | grep -q "$STAGED_VERSION"

      - name: Scenario 2 — pinned version (DIST-008)
        run: |
          export MUX_WEB_BASE_URL="file://$PWD/dist"
          export MUX_WEB_INSTALL_DIR="$PWD/scen2"
          bash install.sh --version 0.2.0 >/dev/null
          ./scen2/mux-web --version | grep -q "0.2.0"

      - name: Scenario 3 — corrupted checksum rejected, old binary intact (DIST-009)
        run: |
          export MUX_WEB_BASE_URL="file://$PWD/dist"
          export MUX_WEB_INSTALL_DIR="$PWD/scen3"
          export MUX_WEB_NO_FALLBACK=1
          bash install.sh --version 0.2.0 >/dev/null
          printf 'deadbeef  mux-web-0.2.0-x86_64-unknown-linux-gnu\n' > "dist/v0.2.0/mux-web-0.2.0-x86_64-unknown-linux-gnu.sha256"
          if bash install.sh --version 0.2.0 >/dev/null 2>&1; then
            echo "FAIL: install should have been rejected"
            exit 1
          fi
          ./scen3/mux-web --version | grep -q "0.2.0"
          # Restore the valid checksum so later scenarios stay hermetic.
          TARGET="x86_64-unknown-linux-gnu"
          (cd "dist/v0.2.0" && sha256sum "mux-web-0.2.0-$TARGET" > "mux-web-0.2.0-$TARGET.sha256")

      - name: Scenario 4a — update.sh upgrades version (DIST-011)
        run: |
          export MUX_WEB_BASE_URL="file://$PWD/dist"
          export MUX_WEB_API_URL="file://$PWD/dist/latest.json"
          export MUX_WEB_INSTALL_DIR="$PWD/scen4"
          bash install.sh --version 0.2.0 >/dev/null
          bash update.sh >/dev/null
          ./scen4/mux-web --version | grep -q "$STAGED_VERSION"

      - name: Scenario 4b — smoke failure rolls back to .bak (DIST-012)
        run: |
          export MUX_WEB_BASE_URL="file://$PWD/dist"
          export MUX_WEB_API_URL="file://$PWD/dist/latest.json"
          export MUX_WEB_INSTALL_DIR="$PWD/scen4b"
          # Hermetic install: never fall back to source (would mask the fixture).
          export MUX_WEB_NO_FALLBACK=1
          bash install.sh --version 0.2.0 >/dev/null
          unset MUX_WEB_NO_FALLBACK
          export MUX_WEB_SMOKE_FAIL=1
          if bash update.sh >/dev/null 2>&1; then
            echo "FAIL: update should have failed (smoke injected)"
            exit 1
          fi
          ./scen4b/mux-web --version | grep -q "0.2.0"

      - name: Scenario 4c — manual rollback idempotent (DIST-012)
        run: |
          export MUX_WEB_BASE_URL="file://$PWD/dist"
          export MUX_WEB_API_URL="file://$PWD/dist/latest.json"
          export MUX_WEB_INSTALL_DIR="$PWD/scen4c"
          bash install.sh --version 0.2.0 >/dev/null
          bash update.sh >/dev/null
          ./scen4c/mux-web --version | grep -q "$STAGED_VERSION"
          bash update.sh --rollback >/dev/null
          ./scen4c/mux-web --version | grep -q "0.2.0"
          bash update.sh --rollback >/dev/null
